<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaMemo - Тест</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --yellow: #FFD700;
      --lilac: #C8A2C8;
      --dark-blue: #1B2B4F;
    }
    body {
      background: linear-gradient(135deg, var(--dark-blue) 0%, #0F1A2E 100%);
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }
    .test-container {
      background: white;
      border-radius: 25px;
      padding: 2rem;
      margin: 30px auto;
      max-width: 700px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .question-card {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      border-left: 5px solid var(--yellow);
    }
    .question-text {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--dark-blue);
      margin-bottom: 0.8rem;
    }
    .option {
      padding: 8px 12px;
      margin: 5px 0;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid #ddd;
    }
    .option:hover {
      background: #f0f0f0;
    }
    .option.selected {
      background: linear-gradient(135deg, var(--yellow), #FFA500);
      border-color: var(--yellow);
      font-weight: bold;
    }
    .btn-finish {
      background: linear-gradient(135deg, var(--yellow), #FFA500);
      color: var(--dark-blue);
      font-weight: bold;
      padding: 12px 30px;
      border-radius: 12px;
      border: none;
      font-size: 1.1rem;
      width: 100%;
    }
    .result-card {
      text-align: center;
      padding: 2rem;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--yellow), #FFA500);
    }
    .score {
      font-size: 3rem;
      font-weight: bold;
    }
    .btn-chat {
      background: var(--dark-blue);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
    }
    .btn-menu {
      background: var(--lilac);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <div id="app"></div>
</div>

<script>

  let questions = []
  function loadQuestion() {
    questions = JSON.parse(localStorage.getItem('theme'))
    for (let i = 0; i < questions.length; i++){
      questions[i].options = questions[i].options.split('", "')
      for (let j = 0; j < questions[i].options.length; j++){
        questions[i].options[j] = questions[i].options[j].replace(/"/g, '')
      }
    }
    console.log(questions)
  }
  loadQuestion()


  let answers = [null, null, null, null, null];
  let finished = false;


  function selectAnswer(qIndex, optIndex) {
    if (finished) return;
    answers[qIndex] = optIndex;
    renderQuestions();
  }


  function finishTest() {

    for (let i = 0; i < answers.length; i++) {
      if (answers[i] === null) {
        return;
      }
    }

    finished = true;


    let correct = 0;
    let results = [];

    for (let i = 0; i < questions.length; i++) {
      const isCorrect = (answers[i] === questions[i].correct);
      if (isCorrect) correct++;

      results.push({
        question: questions[i].text,
        userAnswer: answers[i],
        userText: questions[i].options[answers[i]],
        correctText: questions[i].options[questions[i].correct],
        isCorrect: isCorrect,
        explanation: questions[i].explanation
      });
    }

    const percent = Math.round((correct / questions.length) * 100);


    showResult(results, correct, percent);
  }


  function showResult(results, correct, percent) {
    let message = "";
    if (percent >= 80) message = "🎉 Отлично! Ты хорошо знаешь немецкий!";
    else if (percent >= 60) message = "👍 Неплохо! Продолжай в том же духе!";
    else message = "📚 Попрактикуйся в чате и попробуй снова!";
    let a = []
    if(JSON.parse(localStorage.getItem('resultsOfTest'))) {
      a = JSON.parse(localStorage.getItem('resultsOfTest'))
    }
    let b = [...a]
    let ids = []
    for (let i of b){
      ids.push(i.id)
    }
    if (ids.includes(Number(localStorage.getItem('idOfTest')))){
      let idx = ids.indexOf(Number(localStorage.getItem('idOfTest')))
      b[idx] = {'per':percent, 'id': Number(localStorage.getItem('idOfTest'))}
    } else {
      b.push({'per': percent, 'id': Number(localStorage.getItem('idOfTest'))})
    }
    localStorage.setItem('resultsOfTest', JSON.stringify(b))
    let html = `
            <div class="test-container">
                <div class="result-card">
                    <h2>📊 РЕЗУЛЬТАТ ТЕСТА</h2>
                    <div class="score">${correct} / ${questions.length}</div>
                    <p style="font-size: 1.3rem;">${percent}% правильных</p>
                    <p>${message}</p>
                </div>
                <h3 class="mt-4 mb-3">📋 Разбор вопросов</h3>
        `;

    for (let i = 0; i < results.length; i++) {
      const r = results[i];
      const icon = r.isCorrect ? "✅" : "❌";
      const borderColor = r.isCorrect ? "#28a745" : "#dc3545";

      html += `
                <div class="question-card" style="border-left-color: ${borderColor}">
                    <div class="question-text">${icon} ${i+1}. ${r.question}</div>
                    <div><strong>Твой ответ:</strong> ${String.fromCharCode(65 + r.userAnswer)}. ${r.userText}</div>
                    ${!r.isCorrect ? `<div class="mt-1"><strong>Правильный ответ:</strong> ${String.fromCharCode(65 + answers[i])}. ${r.correctText}</div>` : ''}
                    <div class="mt-2 text-muted">📖 ${r.explanation}</div>
                </div>
            `;
    }

    html += `
                <div class="text-center mt-4">
                    <button class="btn-chat" onclick="window.location.href='chat.html'">💬 Перейти в чат</button>
                    <button class="btn-menu ms-2" onclick="window.location.href='main.html'">🏠 Выбрать тему</button>
                </div>
            </div>
        `;

    document.getElementById('app').innerHTML = html;
  }


  function renderQuestions() {

    let answeredCount = answers.filter(a => a !== null).length;

    let html = `
            <div class="test-container">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 style="color: var(--dark-blue);">📝 Тест: Немецкий язык</h2>
                    <span class="badge bg-warning text-dark" style="padding: 8px 12px;">Отвечено: ${answeredCount}/${questions.length}</span>
                </div>
        `;

    for (let i = 0; i < questions.length; i++) {
      const q = questions[i];
      const selected = answers[i];

      html += `
                <div class="question-card">
                    <div class="question-text">${i+1}. ${q.text}</div>
                    <div>
                        ${q.options.map((opt, idx) => `
                            <div class="option ${selected === idx ? 'selected' : ''}"
                                 onclick="selectAnswer(${i}, ${idx})">
                                ${String.fromCharCode(65 + idx)}. ${opt}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
    }

    html += `
                <div class="text-center mt-3">
                    <button class="btn-finish" onclick="finishTest()">
                        ✅ ЗАВЕРШИТЬ ТЕСТ
                    </button>
                </div>
            </div>
        `;

    document.getElementById('app').innerHTML = html;
  }


  renderQuestions();
</script>
</body>
</html>
