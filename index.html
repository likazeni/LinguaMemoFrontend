
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaMemo - Вход</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    :root {
      --yellow: #FFD700;
      --lilac: #C8A2C8;
      --dark-blue: #1B2B4F;
    }

    body {
      background: linear-gradient(135deg, var(--dark-blue) 0%, #0F1A2E 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    .login-box {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border-top: 5px solid var(--yellow);
    }

    .logo {
      color: var(--dark-blue);
      font-size: 1.8rem;
      font-weight: bold;
    }

    .logo span {
      color: var(--yellow);
    }

    .form-control {
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      padding: 12px 15px;
      transition: all 0.2s;
    }

    .form-control:focus {
      border-color: var(--lilac);
      box-shadow: 0 0 0 3px rgba(200, 162, 200, 0.2);
    }

    .btn-login {
      background: linear-gradient(135deg, var(--yellow), #FFA500);
      color: var(--dark-blue);
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      border: none;
      width: 100%;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
    }

    .register-link {
      color: var(--dark-blue);
      text-decoration: none;
      font-weight: 500;
    }

    .register-link:hover {
      color: var(--lilac);
    }

    .error {
      color: #dc3545;
      font-size: 0.8rem;
      margin-top: 5px;
      display: none;
    }

    .form-control.error-input {
      border-color: #dc3545;
    }

    .form-check-input:checked {
      background-color: var(--lilac);
      border-color: var(--lilac);
    }

    .forgot-link {
      color: var(--lilac);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .forgot-link:hover {
      color: var(--dark-blue);
    }
  </style>
</head>
<body>
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="row w-100" style="max-width: 450px;">
    <div class="col-12">

      <div class="login-box">

        <div class="text-center mb-4">
          <div class="logo">Lingua<span>Memo</span></div>
          <p class="text-muted mt-2">Изучай немецкий с нейросетью</p>
        </div>

        <h5 class="text-center mb-4" style="color: var(--dark-blue);">Вход в аккаунт</h5>

        <form id="loginForm">

          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="email" placeholder="your@email.com" autocomplete="off">
            <div class="error" id="emailError">Введите корректный email</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Пароль</label>
            <input type="password" class="form-control" id="password" placeholder="Ваш пароль">
            <div class="error" id="passwordError">Введите пароль</div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label" for="rememberMe">
                Запомнить меня
              </label>
            </div>
            <a href="#" class="forgot-link" id="forgotLink">Забыли пароль?</a>
          </div>

          <button type="submit" class="btn-login">
            Войти
          </button>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted">Нет аккаунта?</span>
          <a href="#" class="register-link ms-1" id="registerLink">Зарегистрироваться</a>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>


  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    clearErrors();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const rememberMe = document.getElementById('rememberMe').checked;

    let isValid = true;

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email || !emailRegex.test(email)) {
      showError('emailError');
      document.getElementById('email').classList.add('error-input');
      isValid = false;
    }

    if (!password) {
      showError('passwordError');
      document.getElementById('password').classList.add('error-input');
      isValid = false;
    }

    if (!isValid) return;

    if (rememberMe) {
      localStorage.setItem('savedEmail', email);
    } else {
      localStorage.removeItem('savedEmail');
    }

    try {
      const response = await fetch('https://linguamemobackend.onrender.com/api/ccd29bde7c0f4eb7dacdf306dc93e47a/users');

      const data = await response.json();
      if (data[email].password == password) {

        const userData = {
          email: email,
          username: data[email].username,
          isLoggedIn: true
        };
        localStorage.setItem('currentUser', JSON.stringify(userData));

        window.location.href = 'main.html';
      } else {
        document.getElementById('password').classList.add('error-input');
        showError('passwordError');
        document.getElementById('passwordError').textContent = data.message || 'Неверный email или пароль';
      }
    } catch (error) {
      console.error('Ошибка:', error);
    }
  });

  document.getElementById('registerLink').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = 'registration.html';
  });

  function showError(id) {
    document.getElementById(id).style.display = 'block';
  }

  function clearErrors() {
    document.querySelectorAll('.error').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error-input'));
  }

  document.querySelectorAll('.form-control').forEach(input => {
    input.addEventListener('input', () => {
      input.classList.remove('error-input');
      const errorId = input.id + 'Error';
      const errorDiv = document.getElementById(errorId);
      if (errorDiv) errorDiv.style.display = 'none';
    });
  });
</script>
</body>
</html>
